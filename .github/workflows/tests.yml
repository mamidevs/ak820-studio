name: Source tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  studio:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r studio/requirements.txt
      - name: Test with fake devices and temporary state
        working-directory: studio
        run: python -m unittest discover -s tests -v

  firmware-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Portable menu, bridge, raster and idle tests
        run: make -C firmware/tests test CC=clang
